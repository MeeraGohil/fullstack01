<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Encave Café</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--green-dark);padding:40px 20px;}
.auth-card{background:var(--white);border-radius:var(--radius);padding:48px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,0.3);}
.auth-logo{text-align:center;margin-bottom:32px;}
.auth-logo img{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;display:block;border:3px solid var(--gold);}
.auth-logo h2{font-size:26px;color:var(--green-dark);}
.auth-logo p{font-size:14px;color:var(--text-light);margin-top:4px;}
.form-group{margin-bottom:20px;}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--green-dark);margin-bottom:6px;}
.form-group input{width:100%;padding:13px 16px;border:1.5px solid rgba(26,58,42,0.15);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:15px;transition:border-color 0.2s;}
.form-group input:focus{border-color:var(--green-light);outline:none;}
.auth-submit{width:100%;padding:15px;font-size:15px;font-weight:700;border-radius:50px;cursor:pointer;border:none;background:var(--green-dark);color:var(--gold);font-family:'DM Sans',sans-serif;margin-top:8px;transition:var(--transition);}
.auth-submit:hover{background:var(--green-mid);transform:translateY(-1px);}
.auth-switch{text-align:center;margin-top:20px;font-size:14px;color:var(--text-light);}
.auth-switch a{color:var(--green-light);font-weight:600;}
.auth-tabs{display:flex;border-bottom:2px solid var(--green-pale);margin-bottom:28px;}
.auth-tab{flex:1;padding:12px;background:none;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;color:var(--text-light);border-bottom:2px solid transparent;margin-bottom:-2px;transition:var(--transition);}
.auth-tab.active{color:var(--green-dark);border-bottom-color:var(--green-dark);}
#registerForm{display:none;}
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card fade-up visible">
    <div class="auth-logo">
      <img src="IMG_9419_2.PNG" alt="Encave">
      <h2>Welcome Back</h2>
      <p>Sign in to order from Encave Café</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login',this)">Login</button>
      <button class="auth-tab" onclick="switchTab('register',this)">Register</button>
    </div>
    <div id="loginForm">
      <div class="form-group"><label>Email or Phone</label><input type="text" id="loginId" placeholder="Enter email or phone"></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPwd" placeholder="Enter password"></div>
      <button class="auth-submit" onclick="doLogin()">Login to Encave →</button>
    </div>
    <div id="registerForm">
      <div class="form-group"><label>Full Name</label><input type="text" id="regName" placeholder="Your name"></div>
      <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="student@mitwpu.edu.in"></div>
      <div class="form-group"><label>Phone</label><input type="tel" id="regPhone" placeholder="10-digit number"></div>
      <div class="form-group"><label>Password</label><input type="password" id="regPwd" placeholder="Create password"></div>
      <button class="auth-submit" onclick="doRegister()">Create Account →</button>
    </div>
    <p style="text-align:center;margin-top:20px;"><a href="index.html" style="color:var(--green-light);font-size:14px;">← Back to Home</a></p>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
<script>
function switchTab(tab, el) {
  document.querySelectorAll('.auth-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('loginForm').style.display = tab==='login'?'block':'none';
  document.getElementById('registerForm').style.display = tab==='register'?'block':'none';
}
function doLogin() {
  const id = document.getElementById('loginId').value.trim();
  const pwd = document.getElementById('loginPwd').value;
  if (!id || !pwd) { showToast('⚠️ Fill all fields'); return; }
  fetch(`${API_BASE}/auth/login`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ emailOrPhone: id, password: pwd })
  }).then(r=>r.json()).then(data => {
    if (data.token) {
      localStorage.setItem('encave_token', data.token);
      localStorage.setItem('encave_user', JSON.stringify(data.user));
      showToast('✅ Login successful!');
      setTimeout(()=>window.location.href='index.html',1000);
    } else { showToast('⚠️ ' + (data.message||'Login failed')); }
  }).catch(()=>{ showToast('Cannot connect to server. Try later.'); });
}
function doRegister() {
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const phone=document.getElementById('regPhone').value.trim();
  const pwd=document.getElementById('regPwd').value;
  if (!name||!email||!phone||!pwd){showToast('⚠️ Fill all fields');return;}
  fetch(`${API_BASE}/auth/register`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,email,phone,password:pwd})
  }).then(r=>r.json()).then(data=>{
    if(data.token){localStorage.setItem('encave_token',data.token);showToast('✅ Account created!');setTimeout(()=>window.location.href='index.html',1000);}
    else showToast('⚠️ '+(data.message||'Registration failed'));
  }).catch(()=>showToast('Cannot connect to server.'));
}
</script>
</body>
</html>
